# Sentinel CI — Full Test Suite with Live PostgreSQL Integration
#
# Triggers: pushes to main, all pull requests.
#
# Three jobs:
#   offline   — pure unit and mocked tests; no database required.
#   postgres  — full live integration suite with PostgreSQL 16 service.
#   container — builds the runtime image and smoke-tests the Docker Compose
#               stack (PostgreSQL + API + worker) end to end. Requires no Groq
#               key and contacts no external service.
#
# Skip enforcement (postgres job): fails if more than 2 tests skip on Linux.
#   Expected skip count with PostgreSQL available on Linux:
#   - 0 skips: the two Windows-symlink tests use a runtime probe (_can_symlink())
#     that passes on Linux without elevated privileges, so they execute and pass.
#   - We allow ≤ 2 as a conservative margin for future platform-conditioned additions.
#   - More than 2 skips indicates PostgreSQL tests are silently not running.
#
# git diff --check: checks the committed diff of the push or PR for whitespace
#   errors. Uses fetch-depth: 0 to ensure HEAD~1 is available on push events,
#   and the PR base SHA for pull_request events without shallow-clone truncation.

name: CI

'on':
  push:
    branches: ["main"]
  pull_request:

env:
  # Canonical PostgreSQL credentials matching docker-compose.yml defaults.
  SENTINEL_DATABASE_URL: postgresql://sentinel:sentinel_dev_password@localhost:5432/sentinel_db
  # Disable real LLM calls — all tests mock the Groq client.
  GROQ_API_KEY: "test-key-not-used"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  # --------------------------------------------------------------------------
  # JOB 1: Offline unit + mocked tests — no database required
  # --------------------------------------------------------------------------
  offline:
    name: "Offline Tests (no DB)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # fetch-depth: 0 ensures complete history is available so git diff --check
          # can compare HEAD~1..HEAD on push and github.event.pull_request.base.sha
          # on pull_request without shallow-clone bad-object errors.
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run offline test suite (database tests skipped)
        # Exclude the four PostgreSQL-only test modules so this job has zero
        # database dependency. test_persistence_contract.py is intentionally
        # NOT excluded — it contains TestFilesystemRepositoryContract (18 offline
        # tests with no PostgreSQL dependency) and no PostgreSQL subclass.
        # tests/test_pg_retry.py is intentionally NOT excluded: its offline
        # retry-engine and repository-wiring tests run here, while its 4 live
        # integration tests skip gracefully via @pytest.mark.skipif and execute
        # in the postgres job.
        run: |
          python -m pytest tests/ \
            --ignore=tests/test_postgres_persistence.py \
            --ignore=tests/test_postgres_concurrency.py \
            --ignore=tests/test_schema_migration.py \
            --ignore=tests/test_outbox.py \
            -v --tb=short -q
        env:
          # Explicitly unset to confirm the offline path works without any DB.
          SENTINEL_DATABASE_URL: ""

      - name: Validate incident dataset integrity
        run: python tests/validate_incidents.py

      - name: Check committed diff for whitespace errors
        # Checks the whitespace hygiene of committed changes, not the working tree.
        # On push:         compares HEAD~1..HEAD (the pushed commit).
        # On pull_request: compares the PR base SHA to the PR head commit.
        # fetch-depth: 0 ensures complete history is available for PR base SHA and HEAD~1.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            echo "PR diff check: $BASE...HEAD"
            git diff --check "$BASE"...HEAD
          else
            echo "Push diff check: HEAD~1..HEAD"
            git diff --check HEAD~1..HEAD
          fi

  # --------------------------------------------------------------------------
  # JOB 2: Full suite with live PostgreSQL 16
  # --------------------------------------------------------------------------
  postgres:
    name: "Full Suite + Live PostgreSQL 16"
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel_dev_password
          POSTGRES_DB: sentinel_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinel -d sentinel_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Wait for PostgreSQL to be healthy
        # GitHub's health-check options wait for the container to pass before
        # starting the job steps, but we add an explicit final probe as a
        # belt-and-suspenders check.
        run: |
          for i in $(seq 1 20); do
            pg_isready -h localhost -p 5432 -U sentinel -d sentinel_db && break
            echo "Waiting for PostgreSQL... attempt $i"
            sleep 2
          done
          pg_isready -h localhost -p 5432 -U sentinel -d sentinel_db

      - name: Bootstrap database schema
        run: |
          python -m core.persistence.schema apply \
            --url "$SENTINEL_DATABASE_URL"

      - name: Verify schema is complete
        run: |
          python -m core.persistence.schema verify \
            --url "$SENTINEL_DATABASE_URL"

      - name: Run full test suite with PostgreSQL enabled
        # With SENTINEL_DATABASE_URL set and reachable, POSTGRES_AVAILABLE=True
        # inside every test module, so all 46 PostgreSQL integration tests run
        # (36 from Mission 14 + Mission 15's 4 transient-failure retry tests +
        # Mission 16's 6 outbox claim/recovery tests).
        # Output saved to XML for skip-count parsing without a second pytest run.
        # Expected on Linux with PostgreSQL: 743 passed, 0 skipped, 1 warning.
        run: |
          python -m pytest tests/ -v --tb=short \
            --junitxml=test-results.xml

      - name: Assert no unexpected skips
        # Parse the JUnit XML written by the previous step — no second pytest run.
        # The two Windows-symlink tests pass on Linux (runtime _can_symlink() probe
        # succeeds without elevated privileges), so expected skip count is 0.
        # We allow ≤ 2 as a conservative margin for future platform-conditioned tests.
        # Failure here means PostgreSQL integration tests are silently skipping,
        # which indicates SENTINEL_DATABASE_URL is wrong or the schema was not applied.
        run: |
          python - <<'EOF'
          import xml.etree.ElementTree as ET, sys

          tree = ET.parse("test-results.xml")
          root = tree.getroot()

          # Count skipped test cases directly from <skipped> tags to prevent
          # any double-counting from nested testsuites, falling back to suite attributes.
          skipped_tags = len(list(root.iter("skipped")))
          suite_skips = sum(int(s.get("skipped", 0)) for s in root.iter("testsuite"))
          total_skipped = skipped_tags if skipped_tags > 0 else suite_skips

          print(f"Total skipped: {total_skipped}")

          if total_skipped > 2:
              print(
                  f"ERROR: Expected at most 2 skips on Linux CI (conservative margin).\n"
                  f"       Got {total_skipped} skips.\n"
                  f"       Check that SENTINEL_DATABASE_URL is reachable and the schema\n"
                  f"       was applied by the 'Bootstrap database schema' step above.\n"
                  f"       Do not weaken skip guards to hide this failure."
              )
              sys.exit(1)
          EOF

      - name: Validate incident dataset integrity
        run: python tests/validate_incidents.py

      - name: Check committed diff for whitespace errors
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            echo "PR diff check: $BASE...HEAD"
            git diff --check "$BASE"...HEAD
          else
            echo "Push diff check: HEAD~1..HEAD"
            git diff --check HEAD~1..HEAD
          fi

  # --------------------------------------------------------------------------
  # JOB 3: Container deployment smoke test (Docker + Compose)
  # --------------------------------------------------------------------------
  # Builds the runtime image from ./Dockerfile, brings up the Compose stack
  # (PostgreSQL 16 + API + worker) and asserts the deployment is healthy end to
  # end:
  #   - the image runs as the non-root user (uid 10001) on runtime-only deps;
  #   - PostgreSQL and the API reach their Compose health checks;
  #   - GET /health returns 200 and GET /ready returns 200 reporting readiness;
  #   - the worker starts, stays running and applies the shared schema, so the
  #     API and the worker provably use the same PostgreSQL service;
  #   - the stack is torn down (containers + volumes) even when a check fails.
  # No Groq key is required and no external LLM service is contacted: the image
  # default CMD starts uvicorn with the Compose-provided safe defaults.
  # Every wait is bounded, and failure output is dumped before teardown.
  container:
    name: "Container Smoke Test (Compose)"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Build the image once and have Compose reuse the same tag (no rebuild).
      SENTINEL_IMAGE: sentinel-api:ci
      # The API's published host port must match the checks below.
      SENTINEL_API_HOST_PORT: "8000"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build the runtime image from the repository Dockerfile
        run: docker build --tag "$SENTINEL_IMAGE" .

      - name: Assert the image runs as the non-root user
        run: |
          set -euo pipefail
          id_output="$(docker run --rm "$SENTINEL_IMAGE" id)"
          echo "$id_output"
          if ! echo "$id_output" | grep -q 'uid=10001'; then
            echo "ERROR: image does not run as uid 10001 (non-root)."
            exit 1
          fi

      - name: Assert runtime-only dependencies and no development material
        run: |
          set -euo pipefail
          docker run --rm -i "$SENTINEL_IMAGE" python - <<'PY'
          import importlib.util, os, sys

          required = ("starlette", "uvicorn", "pydantic", "jsonschema", "psycopg", "psycopg_pool", "groq", "dotenv")
          missing = [name for name in required if importlib.util.find_spec(name) is None]
          leaked = [path for path in (
              "/app/tests", "/app/eval", "/app/trajectories", "/app/docs",
              "/app/.env", "/app/Makefile", "/app/pytest.ini", "/app/requirements-dev.txt",
          ) if os.path.exists(path)]
          pytest_present = importlib.util.find_spec("pytest") is not None

          print("missing runtime modules:", missing)
          print("leaked development material:", leaked)
          print("pytest present (must be False):", pytest_present)

          ok = not missing and not leaked and not pytest_present and os.path.exists("/app/requirements-runtime.txt")
          sys.exit(0 if ok else 1)
          PY

      - name: Validate the Compose configuration
        run: docker compose config --quiet

      - name: Start the Compose stack (PostgreSQL + API + worker)
        # --no-build pins the stack to the exact image built and asserted above
        # (SENTINEL_IMAGE), so no second, unasserted build can be introduced.
        run: docker compose up -d --no-build

      - name: Wait for PostgreSQL and the API to become healthy
        run: |
          set -euo pipefail

          wait_healthy() {
            local service="$1"
            local attempts="${2:-60}"
            local status="unknown"
            local cid=""
            local i
            for i in $(seq 1 "$attempts"); do
              cid="$(docker compose ps -q "$service" || true)"
              if [ -n "$cid" ]; then
                status="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' "$cid" 2>/dev/null || echo unknown)"
              else
                status="not-created"
              fi
              echo "$service health: $status (attempt $i/$attempts)"
              if [ "$status" = "healthy" ]; then
                return 0
              fi
              sleep 5
            done
            echo "ERROR: '$service' never became healthy (last status: $status)."
            return 1
          }

          wait_healthy postgres 40
          wait_healthy sentinel-api 60

      - name: Verify GET /health returns HTTP 200
        run: |
          set -euo pipefail
          body="$(curl -fsS --max-time 10 http://localhost:8000/health)"
          echo "/health response: $body"
          if ! echo "$body" | grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"'; then
            echo "ERROR: /health did not report status ok."
            exit 1
          fi

      - name: Verify GET /ready returns HTTP 200 and reports readiness
        run: |
          set -euo pipefail
          body="$(curl -fsS --max-time 10 http://localhost:8000/ready)"
          echo "/ready response: $body"
          if ! echo "$body" | grep -Eq '"status"[[:space:]]*:[[:space:]]*"ready"'; then
            echo "ERROR: /ready did not report status ready."
            exit 1
          fi
          if ! echo "$body" | grep -Eq '"persistence"[[:space:]]*:[[:space:]]*"ok"'; then
            echo "ERROR: /ready did not report persistence ok."
            exit 1
          fi

      - name: Verify the worker starts and remains running
        run: |
          set -euo pipefail
          local_log="worker.log"
          for i in $(seq 1 30); do
            docker compose logs --no-color sentinel-worker > "$local_log" 2>&1 || true
            if grep -q "Event delivery worker" "$local_log" && grep -q "started" "$local_log"; then
              break
            fi
            echo "waiting for worker startup log (attempt $i/30)"
            sleep 5
          done
          cat "$local_log"
          grep -q "Event delivery worker" "$local_log" || { echo "ERROR: worker startup log is missing."; exit 1; }
          grep -q "started" "$local_log" || { echo "ERROR: worker never reported started."; exit 1; }
          if grep -Eq "Failed to initialise persistence|Failed to initialize outbox schema|Error in event delivery worker" "$local_log"; then
            echo "ERROR: worker log contains failure output."
            exit 1
          fi
          cid="$(docker compose ps -q sentinel-worker)"
          [ -n "$cid" ] || { echo "ERROR: sentinel-worker container not found."; exit 1; }
          running="$(docker inspect -f '{{.State.Running}}' "$cid")"
          restarts="$(docker inspect -f '{{.RestartCount}}' "$cid")"
          echo "sentinel-worker running=$running restartCount=$restarts"
          [ "$running" = "true" ] || { echo "ERROR: worker is not running."; exit 1; }
          [ "$restarts" = "0" ] || { echo "ERROR: worker restarted $restarts time(s)."; exit 1; }

      - name: Verify the API and the worker share the PostgreSQL service
        run: |
          set -euo pipefail
          # The worker applies the schema at startup. Those tables appearing in the
          # Compose PostgreSQL instance prove the worker reached the same database
          # the API serves /ready from (the API itself applies no migrations).
          tables=""
          for i in $(seq 1 30); do
            tables="$(docker compose exec -T postgres psql -U sentinel -d sentinel_db -tAc "select tablename from pg_tables where schemaname = 'public' order by 1" || true)"
            echo "public tables (attempt $i/30):"
            echo "$tables"
            if echo "$tables" | grep -q "investigations" && echo "$tables" | grep -q "event_outbox"; then
              break
            fi
            sleep 5
          done
          echo "$tables" | grep -q "investigations" || { echo "ERROR: 'investigations' table missing in the shared database."; exit 1; }
          echo "$tables" | grep -q "event_outbox" || { echo "ERROR: 'event_outbox' table missing in the shared database."; exit 1; }

      - name: Dump container state and logs on failure
        if: failure()
        run: |
          docker compose ps -a || true
          docker compose logs --no-color --tail=200 || true

      - name: Tear down the Compose stack and remove volumes
        if: always()
        run: docker compose down --volumes --remove-orphans
